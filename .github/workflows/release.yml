name: Release

# Tag-gated releases: pushing a tag `v*` re-runs the test suites on the
# tagged commit, then publishes a GitHub release whose notes are extracted
# from the matching `[x.y.z]` section of CHANGELOG.md — one source of truth
# for release notes, no manual release drafting.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test-tag:
    name: Tests on tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        # Same network-free unit setup as the Tests workflow: fake embedder
        # + mock LLM, no heavy sentence-transformers/torch stack needed.
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests pytest
          pip install -r serving/requirements-dev.txt
      - name: RAG assistant tests
        working-directory: rag-farsi-assistant
        run: python -m pytest tests/ -q
      - name: Serving API tests
        working-directory: serving
        run: python -m pytest tests/ -q

  github-release:
    name: Publish GitHub release
    needs: test-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract the tag's CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - "$TAG" <<'PY' > release_notes.md
          import re
          import sys

          tag = sys.argv[1]  # e.g. v2.6.0
          version = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.S | re.M)
          if not match:
              sys.exit(f"no [{version}] section found in CHANGELOG.md")
          print(match.group(1).strip())
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --verify-tag
