name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly regression + dependency audit (Mondays 05:00 UTC)
    - cron: "0 5 * * 1"

jobs:
  lint:
    name: Lint (ruff, pinned rule set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff check (ruff.toml pins the rules; independent of ruff defaults)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check rag-farsi-assistant/src serving/app rag-farsi-assistant/tests serving/tests tiny-gpt-from-scratch/src tiny-gpt-from-scratch/tests recommender-system/src recommender-system/tests ai-text-detector/src ai-text-detector/tests sms-spam/src sms-spam/tests hf-space-tiny-gpt/src scripts/deploy_tiny_gpt_space.py

  rag-farsi-assistant:
    name: RAG assistant unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # Unit tests run on the deterministic fake embedding backend and a
        # mock LLM, so the heavy sentence-transformers/torch stack is not
        # needed here. pytest-cov feeds the coverage artifact below.
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests pytest pytest-cov pypdf
      - name: Run tests with coverage
        working-directory: rag-farsi-assistant
        # Local measurement pins the suite at 93% — the gate only fires on
        # meaningful coverage regressions, not on formatting churn.
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: rag-coverage-py312
          path: rag-farsi-assistant/coverage.xml

  stock-movement-ml:
    name: Stock pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-movement-ml/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock-movement-ml/requirements.txt pytest
      - name: Run tests
        working-directory: stock-movement-ml
        run: python -m pytest tests/ -q

  tiny-gpt-from-scratch:
    name: TinyGPT from-scratch tests (autograd + transformer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # NumPy-only project: the whole stack (autograd, transformer, Adam)
        # runs and trains on CPU without any ML framework.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Run tests
        working-directory: tiny-gpt-from-scratch
        run: python -m pytest tests/ -q

  recommender-system:
    name: Recommender system tests (CF + matrix factorization)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # The unit tests are synthetic and network-free; the MovieLens
        # evaluation test auto-skips when the dataset is not downloaded.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy pytest
      - name: Run tests
        working-directory: recommender-system
        run: python -m pytest tests/ -q

  ai-text-detector:
    name: AI text detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Synthetic, network-free unit tests (no model artifact needed);
        # the full 20k-sample training run stays out of CI on purpose.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn joblib pytest
      - name: Run tests
        working-directory: ai-text-detector
        run: python -m pytest tests/ -q

  sms-spam:
    name: SMS spam classifier tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn nltk joblib pytest
      - name: Fetch NLTK datasets
        # clean_text() needs stopwords + wordnet; the package downloads
        # them lazily, the tests import the cleaner up front.
        run: python -c "import nltk; nltk.download('stopwords', quiet=True); nltk.download('wordnet', quiet=True)"
      - name: Run tests
        working-directory: sms-spam
        run: python -m pytest tests/ -q

  serving-api:
    name: Serving API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: serving/requirements-dev.txt
      - name: Install dependencies
        # The serving suite is network-free: it injects fake services and
        # exercises the real registry's unavailable path on an empty root.
        run: |
          python -m pip install --upgrade pip
          pip install -r serving/requirements-dev.txt
      - name: Run tests
        working-directory: serving
        run: python -m pytest tests/ -q

  security:
    name: Security scans (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static analysis — bandit (medium+ severity gates)
        # Scans the two shipped Python packages; tests are excluded by
        # design. -ll fails the job on medium or higher findings.
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -q -r rag-farsi-assistant/src serving/app -ll
      - name: Dependency audit — pip-audit on the serving runtime
        # Fresh venv = audit exactly what the API installs (fastapi,
        # uvicorn, pydantic), not the runner's site-packages.
        run: |
          python -m venv audit-venv
          audit-venv/bin/pip install --upgrade pip
          audit-venv/bin/pip install -r serving/requirements.txt pip-audit
          audit-venv/bin/pip-audit --progress-spinner off
