name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly regression + dependency audit (Mondays 05:00 UTC)
    - cron: "0 5 * * 1"

jobs:
  rag-farsi-assistant:
    name: RAG assistant unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # Unit tests run on the deterministic fake embedding backend and a
        # mock LLM, so the heavy sentence-transformers/torch stack is not
        # needed here. pytest-cov feeds the coverage artifact below.
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests pytest pytest-cov
      - name: Run tests with coverage
        working-directory: rag-farsi-assistant
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rag-coverage-py312
          path: rag-farsi-assistant/coverage.xml

  stock-movement-ml:
    name: Stock pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-movement-ml/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock-movement-ml/requirements.txt pytest
      - name: Run tests
        working-directory: stock-movement-ml
        run: python -m pytest tests/ -q

  serving-api:
    name: Serving API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: serving/requirements-dev.txt
      - name: Install dependencies
        # The serving suite is network-free: it injects fake services and
        # exercises the real registry's unavailable path on an empty root.
        run: |
          python -m pip install --upgrade pip
          pip install -r serving/requirements-dev.txt
      - name: Run tests
        working-directory: serving
        run: python -m pytest tests/ -q

  security:
    name: Security scans (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static analysis — bandit (medium+ severity gates)
        # Scans the two shipped Python packages; tests are excluded by
        # design. -ll fails the job on medium or higher findings.
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -q -r rag-farsi-assistant/src serving/app -ll
      - name: Dependency audit — pip-audit on the serving runtime
        # Fresh venv = audit exactly what the API installs (fastapi,
        # uvicorn, pydantic), not the runner's site-packages.
        run: |
          python -m venv audit-venv
          audit-venv/bin/pip install --upgrade pip
          audit-venv/bin/pip install -r serving/requirements.txt pip-audit
          audit-venv/bin/pip-audit --progress-spinner off
