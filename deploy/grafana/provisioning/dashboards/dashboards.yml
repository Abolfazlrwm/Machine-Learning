# Grafana provisioning: load every dashboard JSON in /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: ml-portfolio
    orgId: 1
    folder: ML Portfolio
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
